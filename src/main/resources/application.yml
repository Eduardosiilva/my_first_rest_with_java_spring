cors:
  originsPatterns: htt://localhost:3000,http://localhost:8080
file:
  upload-dir: /Upload-Project/upload-my-first-API
spring:
  application: name=my_first_rest_with_java_spring
  datasource:
    url: jdbc:mysql://localhost:3306/my_first_rest_with_java?useTimezone=true&serverTimezone=UTC
    username: root
    password: admin123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
      format_sql: true
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215MB
springdoc:
  path-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true
