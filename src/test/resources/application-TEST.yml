
cors:
  originsPatterns: http://localhost:3000,http://localhost:8080
spring:
  application: name=my_first_rest_with_java_spring
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215MB
springdoc:
  path-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true
