server:
  port: 8888
cors:
  oringinsPatterns: http://localhost:3000,http://localhost:8080
spring:
  application: name=my_first_rest_with_java_spring
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
      show-sql: false
      open-in-view: false
springdoc:
  path-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true
